[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goldai-autonomous"
version = "0.4.0.dev0"
description = "Research-first architecture for deterministic XAUUSD and Forex strategy evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Babatunde Akanji"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "numpy==2.3.5", "pandas==2.2.3"]
strategies = ["numpy==2.3.5", "pandas==2.2.3"]
data = ["duckdb>=1.1", "pyarrow>=18"]
mt5 = ["MetaTrader5>=5.0; platform_system == 'Windows'"]

[project.scripts]
goldai = "goldai.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=goldai --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
